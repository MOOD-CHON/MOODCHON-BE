spring:
  application:
    name: moodchon

  config:
    import: optional:classpath:application-local.yml

  datasource:
    url: jdbc:postgresql://localhost:5432/moodchon_db
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.hibernate.SQL: debug

openai:
  api-key: ${OPENAI_API_KEY:}
  model: gpt-4o-mini

tour-api:
  service-key: ${TOUR_API_SERVICE_KEY:}

kakao:
  admin-key: ${KAKAO_ADMIN_KEY:}

apple:
  bundle-id: ${APPLE_BUNDLE_ID:com.moodchon.app}
  team-id: ${APPLE_TEAM_ID:}
  key-id: ${APPLE_KEY_ID:}
  private-key-base64: ${APPLE_PRIVATE_KEY_BASE64:}